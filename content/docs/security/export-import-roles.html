<h1 class="page">Export and Import Roles</h1>
<div class="paragraph">
<p>Roles created at runtime are stored in the database and can be exported as ZIP or JSON files, or imported as ZIP. This applies to both resource roles and row-level roles.</p>
</div>
<div class="paragraph">
<p>The related UI views provide <strong>Export</strong> and <strong>Import</strong> options for these tasks.</p>
</div>
